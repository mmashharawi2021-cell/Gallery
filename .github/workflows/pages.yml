name: Build, Validate and Deploy Gallery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify all 28 demos
        run: npm test
      - name: Build production site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Provision GitHub Pages when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o /tmp/page-status.json -w "%{http_code}" -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${url}")
          if [ "${code}" = "404" ]; then
            created=$(curl -sS -o /tmp/page-create.json -w "%{http_code}" -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"build_type":"workflow"}' "${url}")
            if [ "${created}" != "201" ] && [ "${created}" != "409" ]; then
              echo "Pages provisioning failed (HTTP ${created}):"
              cat /tmp/page-create.json
              exit 1
            fi
          elif [ "${code}" != "200" ]; then
            echo "Could not inspect GitHub Pages settings (HTTP ${code})"
            cat /tmp/page-status.json
            exit 1
          fi
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
